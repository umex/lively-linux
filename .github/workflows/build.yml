name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/lively
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore lively.sln
      - run: dotnet build lively.sln --no-restore --configuration Release
      - run: dotnet test lively.sln --no-build --configuration Release
